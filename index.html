
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Online Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #333;
}

/* Header */
header {
    background: #222;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #ff9800;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-size: 16px;
}

nav a:hover {
    color: #ff9800;
}

.cart {
    background: #ff9800;
    padding: 10px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

/* Search */
.search-box {
    text-align: center;
    padding: 25px;
}

.search-box input {
    width: 60%;
    max-width: 500px;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

/* Banner */
.banner {
    background: linear-gradient(120deg, #ff9800, #ff5722);
    color: white;
    text-align: center;
    padding: 65px 20px;
}

.banner h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.banner p {
    font-size: 18px;
    margin-bottom: 20px;
}

.banner button {
    background: white;
    color: #ff5722;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

/* Categories */
.categories {
    text-align: center;
    padding: 35px 15px 10px;
}

.categories button {
    padding: 10px 20px;
    margin: 8px;
    border: none;
    background: #222;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}

.categories button:hover,
.categories button.active {
    background: #ff9800;
}

/* Products */
.section-title {
    text-align: center;
    margin: 30px 0;
    font-size: 28px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 20px 7%;
}

.product {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

.product h3 {
    margin: 12px 0;
}

.price {
    color: #e65100;
    font-size: 20px;
    font-weight: bold;
    margin: 10px;
}

.product button {
    background: #ff9800;
    color: white;
    padding: 11px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.product button:hover {
    background: #e68900;
}

/* Cart */
#cart-section {
    background: white;
    margin: 35px 7%;
    padding: 25px;
    border-radius: 10px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
    gap: 10px;
    flex-wrap: wrap;
}

.cart-item button {
    padding: 5px 10px;
    cursor: pointer;
    border: none;
    background: #ff9800;
    color: white;
    border-radius: 3px;
    margin: 3px;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
}

.checkout {
    display: block;
    margin: 20px 0 0 auto;
    background: #28a745;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
}

/* Footer */
footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}

@media(max-width:600px) {
    header {
        justify-content: center;
    }

    nav {
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 7px;
    }

    .search-box input {
        width: 95%;
    }

    .banner h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<header>
    <div class="logo">ShopEase 🛍️</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#categories">Categories</a>
        <a href="#cart-section">Cart</a>
    </nav>

    <div class="cart" onclick="goToCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </div>
</header>

<!-- Search -->
<div class="search-box">
    <input type="text" id="search"
    placeholder="Search for products..."
    oninput="searchProducts()">
</div>

<!-- Banner -->
<section class="banner" id="home">
    <h1>Welcome to ShopEase!</h1>
    <p>Discover amazing products at the best prices.</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
        Shop Now
    </button>
</section>

<!-- Categories -->
<section class="categories" id="categories">
    <h2>Shop By Category</h2>
    <button class="active" onclick="filterProducts('All',this)">All</button>
    <button onclick="filterProducts('Electronics',this)">Electronics</button>
    <button onclick="filterProducts('Fashion',this)">Fashion</button>
    <button onclick="filterProducts('Accessories',this)">Accessories</button>
</section>

<!-- Products -->
<h2 class="section-title" id="products">Our Products</h2>

<div class="products" id="product-list"></div>

<!-- Shopping Cart -->
<section id="cart-section">
    <h2>🛒 Shopping Cart</h2>
    <div id="cart-items">
        Your cart is empty.
    </div>

    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>

    <button class="checkout" onclick="checkout()">
        Proceed to Checkout
    </button>
</section>

<!-- Footer -->
<footer>
    <h2>ShopEase 🛍️</h2>
    <p>Your One-Stop Online Shopping Destination</p>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script>

// Product Details
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1999,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
    },
    {
        id: 3,
        name: "Running Shoes",
        price: 2499,
        category: "Fashion",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
    },
    {
        id: 4,
        name: "Ladies Handbag",
        price: 1299,
        category: "Fashion",
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"
    },
    {
        id: 5,
        name: "Sunglasses",
        price: 799,
        category: "Accessories",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400"
    },
    {
        id: 6,
        name: "Camera",
        price: 15999,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400"
    },
    {
        id: 7,
        name: "Backpack",
        price: 999,
        category: "Accessories",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"
    },
    {
        id: 8,
        name: "Casual T-Shirt",
        price: 599,
        category: "Fashion",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"
    }
];

let cart = [];

// Display Products
function displayProducts(list) {
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = "<p>No products found.</p>";
        return;
    }

    list.forEach(product => {
        container.innerHTML += `
            <div class="product">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>${product.category}</p>
                <div class="price">₹${product.price}</div>
                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;
    });
}

// Add to Cart
function addToCart(id) {
    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity++;
    } else {
        const product = products.find(p => p.id === id);
        cart.push({...product, quantity: 1});
    }

    updateCart();
}

// Update Cart
function updateCart() {
    const cartItems = document.getElementById("cart-items");
    const count = document.getElementById("cart-count");
    const totalElement = document.getElementById("total");

    cartItems.innerHTML = "";
    let total = 0;
    let itemCount = 0;

    if (cart.length === 0) {
        cartItems.innerHTML = "Your cart is empty.";
    }

    cart.forEach(item => {
        total += item.price * item.quantity;
        itemCount += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name}</span>
                <span>₹${item.price}</span>
                <div>
                    <button onclick="changeQuantity(${item.id},-1)">-</button>
                    ${item.quantity}
                    <button onclick="changeQuantity(${item.id},1)">+</button>
                    <button onclick="removeItem(${item.id})">Remove</button>
                </div>
            </div>
        `;
    });

    count.innerText = itemCount;
    totalElement.innerText = total.toLocaleString("en-IN");
}

// Change Quantity
function changeQuantity(id, amount) {
    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        removeItem(id);
    } else {
        updateCart();
    }
}

// Remove Item
function removeItem(id) {
    cart = cart.filter(p => p.id !== id);
    updateCart();
}

// Search Products
function searchProducts() {
    const value = document.getElementById("search").value.toLowerCase();

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(value) ||
        p.category.toLowerCase().includes(value)
    );

    displayProducts(filtered);
}

// Filter Categories
function filterProducts(category, button) {
    document.querySelectorAll(".categories button").forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

    if (category === "All") {
        displayProducts(products);
    } else {
        displayProducts(products.filter(p =>
            p.category === category
        ));
    }
}

// Go to Cart
function goToCart() {
    document.getElementById("cart-section").scrollIntoView({
        behavior: "smooth"
    });
}

// Checkout
function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty! Please add products.");
    } else {
        alert("Thank you for shopping with ShopEase! Your order has been placed.");
        cart = [];
        updateCart();
    }
}

// Initial Display
displayProducts(products);
updateCart();

</script>

</body>
</html>
